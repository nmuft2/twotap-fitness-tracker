<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoTap">
<meta name="theme-color" content="#151515">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>TwoTap Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-screen app shell. A scrolling view sits above a bottom tab bar; the logging screen is two full-height tap columns (weight | reps), lowest values at the bottom. */
:root{
  --bg:#151515; --surface:#1f1f1f; --raise:#2a2a2a; --line:#333333; --hair:#222222;
  --fg:#f2f2f2; --muted:#a6a6a6; --faint:#7a7a7a;
  --acc:#0071dc; --acc-ink:#4fa3ff; --on-acc:#ffffff;
  --acc-soft:color-mix(in srgb,var(--acc) 22%,var(--surface)); --acc-text:color-mix(in srgb,var(--acc-ink) 45%,var(--fg));
  --gold:#ffc220; --gold-soft:#3a300f; --gold-fill:#ffc220; --danger:#ff7b72; --danger-soft:#3d2020;
  --h0:var(--raise); --h1:color-mix(in srgb,var(--acc) 30%,var(--surface)); --h2:color-mix(in srgb,var(--acc) 55%,var(--surface)); --h3:var(--acc); --h4:var(--acc-ink);
  --scrim:rgba(0,0,0,.6);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --row:58px;
  color-scheme:dark;
}
:root[data-app-theme="light"]{
  --bg:#f3f3f4; --surface:#ffffff; --raise:#e9e9eb; --line:#d9d9dc; --hair:#e6e6e8;
  --fg:#151515; --muted:#5c5f66; --faint:#868991;
  --acc-soft:color-mix(in srgb,var(--acc) 14%,var(--surface)); --acc-text:color-mix(in srgb,var(--acc-ink) 70%,var(--fg));
  --gold:#8a6400; --gold-soft:#fff0c2; --danger:#c62828; --danger-soft:#fde4e4;
  --h1:color-mix(in srgb,var(--acc) 35%,var(--surface)); --h2:color-mix(in srgb,var(--acc) 50%,var(--surface)); --h3:color-mix(in srgb,var(--acc) 80%,var(--surface)); --h4:var(--acc-ink);
  --scrim:rgba(20,20,20,.35);
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
svg{flex:none}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px;padding-bottom:28px}
#view.fixed{overflow:hidden;padding:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--faint)}
#tabs button.on{color:var(--acc-ink)}
#tabs svg{width:24px;height:24px}

/* page headers */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 16px}
.ph h1{font:700 36px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.ph .sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.bar{display:flex;align-items:center;gap:6px;padding:12px 0 14px}
.bar h1{flex:1;min-width:0;font:700 28px/1.05 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.bar .sub{color:var(--muted);font-size:14px;margin:3px 0 0}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg)}
.iconbtn:active{background:var(--raise)}
.iconbtn svg{width:24px;height:24px}
.iconbtn.ink{color:var(--acc-ink)}
.h2{display:flex;justify-content:space-between;align-items:baseline;font:700 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.h2 small{font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;color:var(--faint)}

/* body part grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:104px;padding:16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tile:active{background:var(--raise)}
.tile b{font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.tile span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tile.today{border-color:var(--acc)}
.tile.today span em{font-style:normal;color:var(--acc-ink);font-weight:600}
.tile.add{border-style:dashed;align-items:flex-start;justify-content:center;color:var(--muted)}
.tile.add b{font-size:20px}

.today-card{display:flex;flex-direction:column;gap:10px;padding:14px;margin-bottom:18px;background:var(--acc-soft);border-radius:14px}
.today-card .tc-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--acc-text)}
.today-card .tc-h b{font:700 22px/1 var(--display);text-transform:uppercase;color:var(--fg)}
.today-card .pills button{background:color-mix(in srgb,var(--fg) 8%,transparent)}

.banner{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:16px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-size:14px;font-weight:600}
.banner svg{width:20px;height:20px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li:active{background:var(--raise)}
.li .main{flex:1;min-width:0}
.li .t{display:block;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{width:18px;height:18px;color:var(--faint)}
.li.addrow{color:var(--acc-ink);font-weight:600;min-height:56px}
.li.addrow svg{width:20px;height:20px}
.badge{flex:none;font:700 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--raise);color:var(--muted)}
.badge.blue{background:var(--acc-soft);color:var(--acc-text)}
.empty{color:var(--muted);font-size:15px;margin:6px 0;line-height:1.5}

/* log screen */
.log{height:100%;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:4px;padding:8px 8px 6px}
.lhead .lt{flex:1;min-width:0}
.lhead h1{font:700 26px/1.05 var(--display);text-transform:uppercase;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:8px;min-height:38px;padding-left:16px}
.slab{flex:none;width:58px;display:flex;flex-direction:column;gap:2px;font:700 11px/1.1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.slab em{font-style:normal;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--muted);font-weight:600}
.slab .live{color:var(--acc-ink);font-variant-numeric:tabular-nums}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 10px;border-radius:8px;background:var(--raise);font:600 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}
.chip small{font-size:13px;color:var(--muted);margin-left:1px}
.chip.today{background:var(--acc-soft);color:var(--acc-text)}
.chip.today small{color:var(--acc-text);opacity:.75}
.chips .none{color:var(--muted);font-size:14px;align-self:center;line-height:1.3}
.pickhead{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.pickhead span{padding:8px 12px;font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:center}
.pickhead span em{font-style:normal;color:var(--muted);letter-spacing:.02em;text-transform:none;font-weight:600}
.picker{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.col{position:relative;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.row{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:var(--row);border-bottom:1px solid var(--hair);font:600 32px/1 var(--display);font-variant-numeric:tabular-nums}
.row small{font:600 15px/1 var(--display);color:var(--muted);align-self:center}
.row:active{background:var(--raise)}
.row .tag{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:4px 5px;border-radius:4px;background:var(--raise);color:var(--muted);font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.row .tag.best{background:var(--gold-soft);color:var(--gold)}
.row.sel{background:var(--acc);color:var(--on-acc)}
.row.sel small{color:var(--acc-text)}
.row.sel .tag{background:color-mix(in srgb,var(--on-acc) 20%,transparent);color:var(--on-acc)}
.row.hit{animation:hit .5s ease-out}
.col.nudge{animation:nudge .35s}
@keyframes hit{0%{background:var(--acc);color:var(--on-acc)}100%{background:transparent}}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{display:flex;flex-direction:column;align-items:center;gap:6px;width:58px;font-size:12px;font-weight:600;color:var(--muted)}
.swatches i{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.swatches button.on{color:var(--fg)}
.swatches button.on i{box-shadow:0 0 0 2px var(--fg)}
.snote{margin:0 0 8px;padding:8px 10px;border-radius:8px;background:var(--raise);font-size:14px;line-height:1.4;color:var(--muted);font-style:italic}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--raise);font-weight:700;font-size:16px;text-align:center}
.btn:active{filter:brightness(1.15)}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.dangerfill{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:40px;padding:0 14px;border-radius:20px;background:var(--raise);font-weight:600;font-size:15px}
.pills button.on{background:var(--acc);color:var(--on-acc)}
.pills button.add{background:transparent;border:1px dashed var(--line);color:var(--acc-ink)}
.fl{display:block;margin:18px 0 8px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:17px}
textarea.inp{min-height:120px;padding:12px 14px;font:13px/1.4 ui-monospace,Menlo,monospace}
.inline{display:flex;gap:8px;margin-top:10px}
.inline .inp{flex:1;min-width:0}
.types{display:flex;flex-direction:column;gap:8px}
.types button{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.types button b{font-size:16px}
.types button span{font-size:14px;color:var(--muted);line-height:1.35}
.types button.on{border-color:var(--acc);background:var(--acc-soft)}
.types button.on span{color:var(--acc-text)}
.err{margin:8px 0 0;color:var(--danger);font-size:14px}
.note{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.actions{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.confirm{margin-top:12px;padding:14px;border-radius:12px;background:var(--danger-soft)}
.confirm p{margin:0 0 12px;font-size:15px;line-height:1.45}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}

/* sheet & toast */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{width:100%;max-width:560px;max-height:90%;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0}
.panel .grab{width:40px;height:5px;margin:-6px auto 12px;border-radius:3px;background:var(--line)}
.panel h2{margin:0;font:700 26px/1.1 var(--display);text-transform:uppercase}
.panel .meta{margin:4px 0 0;color:var(--muted);font-size:14px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast .tmsg{flex:1;min-width:0}
#toast .tmsg b{display:block;font-size:13px}
#toast button{min-height:38px;padding:0 14px;border-radius:9px;background:var(--bg);color:var(--fg);font-weight:700;font-size:14px}
#toast.pr{background:var(--gold-fill);color:#1d1600}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{min-width:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font:700 28px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:15px;color:var(--muted);margin-left:2px}
.stat span{display:block;margin-top:6px;font-size:12px;line-height:1.3;color:var(--muted)}
.stat i{display:block;margin-top:3px;font-style:normal;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.card{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.heat{display:grid;grid-template-columns:18px repeat(12,1fr);gap:4px}
.heat .dl{font-size:10px;color:var(--faint);align-self:center}
.heat button{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--h0)}
.heat button.l1{background:var(--h1)} .heat button.l2{background:var(--h2)} .heat button.l3{background:var(--h3)} .heat button.l4{background:var(--h4)}
.heat button.fut{background:transparent;border:1px dashed var(--hair);pointer-events:none}
.heat button.now{outline:2px solid var(--fg);outline-offset:1px}
.heatfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.legend i{width:12px;height:12px;border-radius:3px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:84px 1fr 28px;align-items:center;gap:10px;font-size:14px}
.brow span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.btrack{height:12px}
.bfill{height:100%;border-radius:0 4px 4px 0;background:var(--acc);min-width:3px}
.spark{width:72px;height:30px}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.headline b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.headline span{font-size:14px;color:var(--muted)}
.headline .up{color:var(--acc-ink);font-weight:600}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font:500 11px var(--body);fill:var(--faint);font-variant-numeric:tabular-nums}
.tip{position:absolute;top:-6px;transform:translateX(-50%);padding:6px 9px;border-radius:8px;background:var(--raise);border:1px solid var(--line);font-size:12px;line-height:1.35;color:var(--muted);pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tip b{display:block;color:var(--fg);font-size:14px}
.sess{display:flex;flex-direction:column;gap:2px}
.sess .sd{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:12px 0 6px;border-top:1px solid var(--line)}
.sess .sd:first-child{border-top:0;padding-top:0}
.sess .sd b{color:var(--fg);font-weight:600}
.sess .chips{flex-wrap:wrap;overflow:visible;padding:0 0 4px}
.setbtn{font:inherit}
.seclist{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
@media (prefers-reduced-motion:reduce){.row.hit,.col.nudge{animation:none}}
@media (max-width:360px){.tiles{grid-template-columns:1fr 1fr}.ph h1{font-size:32px}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections">
    <button data-act="tab" data-v="workout"></button>
    <button data-act="tab" data-v="stats"></button>
    <button data-act="tab" data-v="manage"></button>
    <button data-act="tab" data-v="settings"></button>
  </nav>
</div>
<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="restoreFile" accept="application/json,.json,text/plain" hidden>

<script>
(function(){
'use strict';
const KEY='twotap-lift-log-v1';
const DAY=864e5;
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const TYPES={
  weight:{label:'Weight × reps',desc:'Barbell, dumbbell, cable or machine. Log the weight and how many reps.'},
  bodyweight:{label:'Bodyweight × reps',desc:'Push-ups, pull-ups, dips. Log bodyweight, or bodyweight plus added weight.'},
  time:{label:'Weight × time',desc:'Planks and other holds. Log seconds held, with bodyweight or added weight.'}
};
const DEFAULTS={
  Chest:[['Bench Press','weight'],['Incline Dumbbell Press','weight'],['Cable Fly','weight'],['Push-up','bodyweight']],
  Back:[['Pull-up','bodyweight'],['Barbell Row','weight'],['Lat Pulldown','weight'],['Seated Cable Row','weight']],
  Shoulders:[['Overhead Press','weight'],['Lateral Raise','weight'],['Rear Delt Fly','weight']],
  Biceps:[['Bicep Curl','weight'],['Hammer Curl','weight'],['Preacher Curl','weight']],
  Triceps:[['Tricep Pushdown','weight'],['Overhead Tricep Extension','weight'],['Dips','bodyweight']],
  Legs:[['Squat','weight'],['Romanian Deadlift','weight'],['Leg Press','weight'],['Walking Lunge','weight'],['Calf Raise','weight']],

let S=null, storageOK=true;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function defaults(){
  return {v:1,unit:'lb',theme:'dark',accent:'blue',imported:false,parts:HISTORY.parts.slice(),exercises:HISTORY.exercises.map(e=>({...e})),sets:[],lastBackup:null};

function importHistory(){
  const key=n=>n.trim().toLowerCase();
  for(const p of HISTORY.parts) if(!S.parts.some(x=>key(x)===key(p))) S.parts.push(p);
  const map={};
  for(const he of HISTORY.exercises){
    let e=S.exercises.find(x=>key(x.name)===key(he.name));
    if(!e){ e={...he}; if(S.exercises.some(x=>x.id===e.id)) e.id=uid(); S.exercises.push(e); }
    map[he.id]=e.id;
  }
  const used=new Set(S.sets.map(s=>s.ex));
  const drop=new Set(S.exercises.filter(e=>STARTER_NAMES.has(key(e.name))&&!used.has(e.id)&&!HISTORY.exercises.some(h=>key(h.name)===key(e.name))).map(e=>e.id));
  S.exercises=S.exercises.filter(e=>!drop.has(e.id));
  S.parts=S.parts.filter(p=>S.exercises.some(e=>e.part===p)||HISTORY.parts.includes(p));
  const have=new Set(S.sets.map(s=>s.id)); let added=0;
  for(const hs of HISTORY.sets){ if(have.has(hs.id)) continue; S.sets.push({...hs,ex:map[hs.ex]}); added++; }
  S.sets.sort((a,b)=>a.t-b.t); S.imported=true; save();
  return added;
}

  if(!d||typeof d!=='object'||!Array.isArray(d.exercises)||!Array.isArray(d.sets)) throw new Error('bad');
  const out={v:1,unit:d.unit==='kg'?'kg':'lb',theme:['dark','light','auto'].includes(d.theme)?d.theme:'dark',accent:ACCENTS[d.accent]?d.accent:'blue',imported:!!d.imported,parts:Array.isArray(d.parts)?d.parts.filter(p=>typeof p==='string'&&p.trim()):[],exercises:[],sets:[],lastBackup:d.lastBackup||null};
  for(const e of d.exercises){ if(!e||!e.id||!e.name) continue; out.exercises.push({id:String(e.id),name:String(e.name),part:String(e.part||'Other'),type:TYPES[e.type]?e.type:'weight'}); }
  for(const e of out.exercises) if(!out.parts.includes(e.part)) out.parts.push(e.part);
  const ids=new Set(out.exercises.map(e=>e.id));
  for(const s of d.sets){ if(!s||!ids.has(String(s.ex))) continue; const t=+s.t, w=+s.w, n=+s.n; if(!isFinite(t)||!isFinite(w)||!isFinite(n)) continue; const o={id:String(s.id||uid()),ex:String(s.ex),t,w,n}; if(s.sample) o.sample=true; if(s.note) o.note=String(s.note); out.sets.push(o); }

}

const setsOf=id=>S.sets.filter(s=>s.ex===id);
function sessionsOf(id){
  const m=new Map();
  for(const s of S.sets) if(s.ex===id){ const k=dkey(s.t); if(!m.has(k)) m.set(k,[]); m.get(k).push(s); }
  return [...m.entries()].map(([k,sets])=>({k,t:sets[0].t,sets})).sort((a,b)=>a.t-b.t);
}
function todaySets(id){ const k=dkey(Date.now()); return S.sets.filter(s=>s.ex===id&&dkey(s.t)===k); }
function lastSession(id){ const k=dkey(Date.now()); const ss=sessionsOf(id).filter(x=>x.k!==k); return ss.length?ss[ss.length-1]:null; }
function lastSetOf(id){ for(let i=S.sets.length-1;i>=0;i--) if(S.sets[i].ex===id) return S.sets[i]; return null; }
function summary(ex,sets){
  if(!sets.length) return '';
  const top=sets.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.n>a.n))?b:a);
  const w=isBW(ex)?(top.w>0?'BW+'+fmtNum(top.w):'BW'):fmtNum(top.w)+' '+U();
  return ex.type==='time'?`${w} · ${fmtT(top.n)}`:`${w} × ${top.n}`;
}

/* ---------- metrics ---------- */
function metricDefs(ex){
  const all=setsOf(ex.id), anyAdded=all.some(s=>s.w>0);
  const mx=(ss,f)=>Math.max(...ss.map(f)), sm=(ss,f)=>ss.reduce((a,s)=>a+f(s),0);
  const wf=v=>fmtNum(v)+' '+U();
  if(ex.type==='weight') return [
    {id:'e1rm',label:'Est. 1RM',f:ss=>mx(ss,s=>e1rm(s.w,s.n)),fmt:wf,ax:fmtNum,info:'Estimated one-rep max from your best set (Epley formula).'},
    {id:'top',label:'Top weight',f:ss=>mx(ss,s=>s.w),fmt:wf,ax:fmtNum,info:'Heaviest weight lifted each session.'},
    {id:'vol',label:'Volume',f:ss=>sm(ss,s=>s.w*s.n),fmt:v=>fmtBig(v)+' '+U(),ax:v=>v>=1e4?fmtNum(v/1000)+'k':fmtBig(v),info:'Weight × reps, added up across every set in the session.'}
  ];
  const add={id:'add',label:'Added weight',f:ss=>mx(ss,s=>s.w),fmt:wf,ax:fmtNum,info:'Most weight added on top of bodyweight each session.'};
  if(ex.type==='bodyweight') return [
    {id:'topr',label:'Best set',f:ss=>mx(ss,s=>s.n),fmt:v=>v+' reps',ax:fmtNum,info:'Most reps in a single set each session.'},
    {id:'totr',label:'Total reps',f:ss=>sm(ss,s=>s.n),fmt:v=>v+' reps',ax:fmtNum,info:'All reps across the session.'}
  ].concat(anyAdded?[add]:[]);
  return [
    {id:'hold',label:'Longest hold',f:ss=>mx(ss,s=>s.n),fmt:fmtT,ax:fmtT,info:'Longest single hold each session.'},
    {id:'tott',label:'Total time',f:ss=>sm(ss,s=>s.n),fmt:fmtT,ax:fmtT,info:'All hold time across the session.'}
  ].concat(anyAdded?[add]:[]);
}
function records(ex){
  const ss=setsOf(ex.id); if(!ss.length) return [];
  const sess=sessionsOf(ex.id);
  const best=(f)=>ss.reduce((a,b)=>f(b)>f(a)?b:a);
  const out=[];
  if(ex.type==='weight'){
    const h=ss.reduce((a,b)=>(b.w>a.w||(b.w===a.w&&b.n>a.n))?b:a);
    out.push({label:'Heaviest set',v:fmtNum(h.w),u:U(),sub:`× ${h.n} · ${fmtShort(h.t)}`});
    const e=best(s=>e1rm(s.w,s.n));
    out.push({label:'Best est. 1RM',v:fmtNum(Math.round(e1rm(e.w,e.n)*10)/10),u:U(),sub:`${fmtNum(e.w)} × ${e.n}`});
    const v=sess.reduce((a,b)=>{const x=b.sets.reduce((q,s)=>q+s.w*s.n,0);return x>a.v?{v:x,t:b.t}:a;},{v:-1,t:0});
    out.push({label:'Best session volume',v:v.v>=1000?fmtNum(Math.round(v.v/100)/10)+'k':fmtBig(v.v),u:U(),sub:fmtShort(v.t)});
  } else {
    const isT=ex.type==='time';
    const b=ss.reduce((a,c)=>(c.n>a.n||(c.n===a.n&&c.w>a.w))?c:a);
    out.push({label:isT?'Longest hold':'Most reps',v:isT?fmtT(b.n):String(b.n),u:'',sub:`${wText(ex,b.w)} · ${fmtShort(b.t)}`});
    const tot=sess.reduce((a,c)=>{const x=c.sets.reduce((q,s)=>q+s.n,0);return x>a.v?{v:x,t:c.t}:a;},{v:-1,t:0});
    out.push({label:isT?'Most time in a session':'Most reps in a session',v:isT?fmtT(tot.v):String(tot.v),u:'',sub:fmtShort(tot.t)});
    const hw=ss.reduce((a,c)=>(c.w>a.w||(c.w===a.w&&c.n>a.n))?c:a);
    out.push({label:'Heaviest added',v:hw.w>0?'+'+fmtNum(hw.w):'BW',u:hw.w>0?U():'',sub:hw.w>0?`${nText(ex,hw.n)} · ${fmtShort(hw.t)}`:'No added weight yet'});
  }
  return out;
}

/* ---------- navigation ---------- */
let view={name:'home'};
const selW={};
let statsRange='3m';
const metricSel={};
let heatPick=null;
let ticker=null, toastTimer=null, pendingRestore=null;
const TAB_OF={home:'workout',part:'workout',log:'workout',stats:'stats',statsEx:'stats',manage:'manage',settings:'settings'};
function go(v){ view=v; render(false); }
function back(){
  const v=view;
  if(v.name==='log'){ return go(v.from||{name:'part',part:(exById(v.ex)||{}).part}); }
  if(v.name==='part') return go({name:'home'});

/* ---------- render ---------- */
function render(keep){
  const el=document.getElementById('view');
  const top=el.scrollTop;
  clearInterval(ticker); ticker=null;
  if(view.name==='part'&&!S.parts.includes(view.part)) view={name:'home'};
  if((view.name==='log'||view.name==='statsEx')&&!exById(view.ex)) view={name:'home'};
  const fn={home:vHome,part:vPart,log:vLog,stats:vStats,statsEx:vStatsEx,manage:vManage,settings:vSettings}[view.name]||vHome;
  el.className=view.name==='log'?'fixed':'';
  el.innerHTML=fn();
  el.scrollTop=keep?top:0;
  const tabs=document.getElementById('tabs');
  tabs.hidden=view.name==='log';
  const t=TAB_OF[view.name];
  tabs.querySelectorAll('button').forEach(b=>{ const on=b.dataset.v===t; b.classList.toggle('on',on); b.setAttribute('aria-current',on?'page':'false'); });
  after();
}
function renderTabs(){
  const tabs=document.getElementById('tabs').querySelectorAll('button');
  const def={workout:['lift','Workout'],stats:['chart','Stats'],manage:['list','Exercises'],settings:['gear','Settings']};
  tabs.forEach(b=>{ const [i,l]=def[b.dataset.v]; b.innerHTML=ic(i)+'<span>'+l+'</span>'; });

function after(){
  if(view.name==='log'){ positionColumns(); ticker=setInterval(tick,1000); tick(); }
  document.querySelectorAll('[data-chart]').forEach(drawChart);
}

/* ---------- views: workout ---------- */
function partInfo(part){
  const exs=S.exercises.filter(e=>e.part===part), ids=new Set(exs.map(e=>e.id));
  let last=0, today=0; const k=dkey(Date.now());
  for(const s of S.sets) if(ids.has(s.ex)){ if(s.t>last) last=s.t; if(dkey(s.t)===k) today++; }
  return {n:exs.length,last,today};
}
function vHome(){
  const k=dkey(Date.now());
  const todays=S.sets.filter(s=>dkey(s.t)===k);

function vPart(){

/* ---------- views: log (the two-tap screen) ---------- */
function weightValues(ex){
  const top=S.sets.filter(s=>s.ex===ex.id).reduce((a,s)=>Math.max(a,s.w),0);
  const base=isBW(ex)?(U()==='kg'?100:200):(U()==='kg'?300:600);
  const max=Math.max(base,Math.ceil(top)+50);
  const vals=[]; for(let v=max;v>=1;v--) vals.push(v);
  if(isBW(ex)) vals.push(0);
  const sel=selW[ex.id];
  if(sel!=null&&!Number.isInteger(sel)&&!vals.includes(sel)){ vals.push(sel); vals.sort((a,b)=>b-a); }
  return vals;
}
function repValues(ex){
  if(ex.type==='time'){ const v=[]; for(let s=5;s<=180;s+=5) v.push(s); for(let s=195;s<=600;s+=15) v.push(s); return v.reverse(); }
  const v=[]; for(let r=50;r>=1;r--) v.push(r); return v;
}
function defaultW(ex){
  const l=lastSetOf(ex.id); if(l) return l.w;
  return isBW(ex)?0:(U()==='kg'?10:20);
}
function weightRows(ex){
  const sel=selW[ex.id], ls=lastSession(ex.id);
  const used=new Set(ls?ls.sets.map(s=>s.w):[]);
  return weightValues(ex).map(v=>{
    const lab=isBW(ex)?(v===0?'BW':'<small>+</small>'+fmtNum(v)):fmtNum(v);
    return `<button class="row${v===sel?' sel':''}" data-act="w" data-v="${v}" aria-label="${isBW(ex)?(v===0?'Bodyweight':'Bodyweight plus '+v):v} ${v===0&&isBW(ex)?'':U()}">${lab}${used.has(v)?'<span class="tag">last</span>':''}</button>`;
  }).join('');
}
function repTags(ex){
  const w=selW[ex.id]; const k=dkey(Date.now());
  const prev=S.sets.filter(s=>s.ex===ex.id&&s.w===w);
  const ls=lastSession(ex.id); const lastAt=ls?ls.sets.filter(s=>s.w===w):[];
  const best=prev.length?Math.max(...prev.map(s=>s.n)):null;
  const last=lastAt.length?Math.max(...lastAt.map(s=>s.n)):null;
  return {best,last};
}
function repRows(ex){
  const {best,last}=repTags(ex);
  return repValues(ex).map(v=>{
    let tag='';
    if(best===v) tag='<span class="tag best">best</span>'; else if(last===v) tag='<span class="tag">last</span>';
    return `<button class="row" data-act="n" data-v="${v}" aria-label="Log ${ex.type==='time'?fmtT(v):v+' reps'}">${ex.type==='time'?fmtT(v):v}${tag}</button>`;
  }).join('');
}
function todayRow(ex){
  const td=todaySets(ex.id);
  return `<span class="slab">Today<em class="live" id="since"></em></span><div class="chips" id="todayChips">${td.length?td.map((s,i)=>`<button class="chip today setbtn" data-act="set" data-id="${s.id}" aria-label="Set ${i+1}: ${esc(setPlain(ex,s))}">${setHTML(ex,s)}</button>`).join(''):'<span class="none">Tap a weight, then '+(ex.type==='time'?'the time you held':'the reps you did')+'.</span>'}</div>`;
}
function vLog(){
  const ex=exById(view.ex);
  if(selW[ex.id]==null) selW[ex.id]=defaultW(ex);
  const ls=lastSession(ex.id);
  return `<div class="log">
  <header class="lhead"><button class="iconbtn" data-act="back" aria-label="Back">${ic('back')}</button>
    <div class="lt"><h1>${esc(ex.name)}</h1><p>${esc(ex.part)} · ${TYPES[ex.type].label}</p></div>
    <button class="iconbtn ink" data-act="exstats" data-id="${ex.id}" aria-label="Progress for ${esc(ex.name)}">${ic('chart')}</button></header>
  <section class="strip">
    <div class="srow"><span class="slab">Last<em>${ls?esc(ago(ls.t)):''}</em></span><div class="chips">${ls?ls.sets.map(s=>`<span class="chip">${setHTML(ex,s)}</span>`).join(''):'<span class="none">First time logging this one.</span>'}</div></div>
    <div class="srow" id="todayRow">${todayRow(ex)}</div>
  </section>
  <div class="pickhead"><span>${isBW(ex)?'Added '+U():U()}</span><span>${ex.type==='time'?'Time held':'Reps'} <em>· tap to log</em></span></div>
  <div class="picker"><div class="col" id="colW" aria-label="Weight">${weightRows(ex)}</div><div class="col" id="colR" aria-label="${ex.type==='time'?'Time':'Reps'}">${repRows(ex)}</div></div>
</div>`;
}
function centerOn(col,row){ if(col&&row) col.scrollTop=row.offsetTop-col.clientHeight/2+row.offsetHeight/2; }
function positionColumns(){
  const ex=exById(view.ex), cw=document.getElementById('colW'), cr=document.getElementById('colR');
  centerOn(cw,cw.querySelector('.row.sel'));
  const {last,best}=repTags(ex);
  const target=last??best??(ex.type==='time'?30:8);
  centerOn(cr,cr.querySelector(`.row[data-v="${target}"]`));
}
function tick(){
  const el=document.getElementById('since'); if(!el) return;
  const td=todaySets(view.ex); if(!td.length){ el.textContent=''; return; }
  const sec=Math.max(0,Math.floor((Date.now()-td[td.length-1].t)/1000));
  el.textContent=sec<3600?fmtT(sec)+' rest':'';
}
function pickWeight(v,btn){
  const ex=exById(view.ex); selW[ex.id]=v;
  document.querySelectorAll('#colW .row.sel').forEach(r=>r.classList.remove('sel'));
  btn.classList.add('sel');
  refreshReps(ex);
}
function refreshReps(ex){
  const cr=document.getElementById('colR'); if(!cr) return;
  const top=cr.scrollTop; cr.innerHTML=repRows(ex); cr.scrollTop=top;
}
function prCheck(ex,prior,w,n){
  if(!prior.length) return null;
  if(ex.type==='weight'){
    const best=Math.max(...prior.map(s=>e1rm(s.w,s.n)));
    if(e1rm(w,n)>best+1e-9) return 'New best est. 1RM: '+fmtNum(Math.round(e1rm(w,n)*10)/10)+' '+U();
  }
  const at=prior.filter(s=>s.w===w);
  if(at.length&&n>Math.max(...at.map(s=>s.n))) return ex.type==='time'?`Longest hold at ${wText(ex,w)}`:`Rep record at ${wText(ex,w)}`;
  if(w>Math.max(...prior.map(s=>s.w))&&(w>0)) return 'Heaviest yet';
  return null;
}
function logSet(n,btn){
  const ex=exById(view.ex), w=selW[ex.id];
  if(w==null){ const c=document.getElementById('colW'); c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge'); toast('Pick a weight first'); return; }
  const prior=setsOf(ex.id);
  const pr=prCheck(ex,prior,w,n);
  const s={id:uid(),ex:ex.id,t:Date.now(),w,n};
  S.sets.push(s); save();
  btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit');
  document.getElementById('todayRow').innerHTML=todayRow(ex);
  const tc=document.getElementById('todayChips'); tc.scrollLeft=tc.scrollWidth;
  tick(); refreshReps(ex);
  const num=todaySets(ex.id).length;
  toast(`Set ${num} · ${setPlain(ex,s)}`,{undo:s.id,pr});
  if(!storageOK) toast('Logged, but this browser is not saving. Add the app to your Home Screen.');
}
function removeSet(id){
  const i=S.sets.findIndex(s=>s.id===id); if(i<0) return null;
  const [s]=S.sets.splice(i,1); save(); return s;
}

/* ---------- views: stats ---------- */
function vStats(){
  let h=`<header class="ph"><div><h1>Stats</h1><p class="sub">Your training at a glance</p></div></header>`;
  const real=S.sets;
  if(!real.length){
    return h+`<div class="card"><p class="empty" style="margin:0">Nothing logged yet. Log a set from the Workout tab${S.imported?'':', or import your spreadsheet history in Settings,'} and your progress charts appear here.</p></div>`;
  }
  const now=Date.now(), wk=now-7*DAY;
  const last7=real.filter(s=>s.t>=startOfDay(now)-6*DAY);
  const days7=new Set(last7.map(s=>dkey(s.t))).size;
  const sample=real.some(s=>s.sample);
  h+=`<div class="tiles"><div class="stat"><b>${days7}</b><span>days trained, last 7 days</span></div><div class="stat"><b>${last7.length}</b><span>sets, last 7 days</span></div><div class="stat"><b>${new Set(real.map(s=>dkey(s.t))).size}</b><span>workouts logged in total</span></div></div>`;
  if(sample) h+=`<p class="note">Includes sample history. Remove it in Settings.</p>`;
  // heatmap
  const counts={}; const partsByDay={};
  for(const s of real){ const k=dkey(s.t); counts[k]=(counts[k]||0)+1; const e=exById(s.ex); if(e){ (partsByDay[k]=partsByDay[k]||new Set()).add(e.part);} }
  const today=new Date(startOfDay(now)); const dow=(today.getDay()+6)%7; // Monday=0
  const start=new Date(today); start.setDate(start.getDate()-dow-7*11);
  let cells='';
  const dl=['M','','W','','F','','S'];
  for(let r=0;r<7;r++){
    cells+=`<span class="dl">${dl[r]}</span>`;
    for(let c=0;c<12;c++){
      const d=new Date(start); d.setDate(start.getDate()+c*7+r);
      const k=dkey(d.getTime()), n=counts[k]||0, fut=d.getTime()>today.getTime();
      const lv=n===0?0:n<8?1:n<15?2:n<22?3:4;
      cells+=`<button class="${fut?'fut':(lv?'l'+lv:'')}${k===dkey(now)?' now':''}${heatPick===k?' now':''}" data-act="heat" data-v="${k}" data-n="${n}" aria-label="${esc(fmtDate(d.getTime()))}: ${n} sets"></button>`;
    }
  }
  let foot='Tap a day to see it.';
  if(heatPick){ const n=counts[heatPick]||0; const [y,m,dd]=heatPick.split('-').map(Number); const t=new Date(y,m-1,dd).getTime(); foot=`<span><b style="color:var(--fg)">${esc(fmtDate(t))}</b> · ${n?n+' sets · '+esc([...(partsByDay[heatPick]||[])].join(', ')):'rest day'}</span>`; }
  h+=`<div class="h2">Last 12 weeks</div><div class="card"><div class="heat">${cells}</div><div class="heatfoot">${foot}<span class="legend">Less<i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>More</span></div></div>`;
  // sets by body part, last 7 days
  const bp={}; for(const s of last7){ const e=exById(s.ex); if(e) bp[e.part]=(bp[e.part]||0)+1; }
  const rows=Object.entries(bp).sort((a,b)=>b[1]-a[1]); const mx=rows.length?rows[0][1]:1;
  h+=`<div class="h2">Sets by body part <small>last 7 days</small></div><div class="card">${rows.length?`<div class="bars">${rows.map(([p,n])=>`<div class="brow"><span>${esc(p)}</span><div class="btrack"><div class="bfill" style="width:${Math.max(2,n/mx*100)}%"></div></div><b>${n}</b></div>`).join('')}</div>`:'<p class="empty" style="margin:0">No sets in the last 7 days.</p>'}</div>`;
  // exercises
  const exs=S.exercises.filter(e=>S.sets.some(s=>s.ex===e.id)).sort((a,b)=>lastSetOf(b.id).t-lastSetOf(a.id).t);
  h+=`<div class="h2">Exercises <small>tap for charts</small></div><div class="list">`;
  for(const e of exs){
    const md=metricDefs(e)[0], ss=sessionsOf(e.id).slice(-12), vals=ss.map(x=>md.f(x.sets));
    const cur=vals[vals.length-1];
    h+=`<button class="li" data-act="exstats" data-id="${e.id}"><span class="main"><span class="t">${esc(e.name)}</span><span class="s">${esc(md.label)} ${esc(md.fmt(cur))} · ${esc(ago(ss[ss.length-1].t))}</span></span>${spark(vals)}${ic('chev').replace('<svg','<svg class="chev"')}</button>`;
  }
  return h+`</div>`;
}
function spark(vals){
  if(vals.length<2) return '<svg class="spark" viewBox="0 0 72 30" aria-hidden="true"></svg>';
  const mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(68/(vals.length-1)),26-(v-mn)/r*22]);
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 72 30" aria-hidden="true"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--acc-ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="var(--acc-ink)"/></svg>`;
}

/* ---------- chart ---------- */
function niceTicks(mn,mx,count){
  if(mn===mx){ const p=Math.max(1,Math.abs(mn)*0.1); mn-=p; mx+=p; }
  const raw=(mx-mn)/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), e=raw/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const lo=Math.floor(mn/step)*step, hi=Math.ceil(mx/step)*step, out=[];
  for(let v=lo;v<=hi+step/2;v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}
function drawChart(el){
  const C=window.__chart; if(!C) return;
  const pts=C.pts;
  if(!pts.length){ el.innerHTML='<p class="empty">No sessions in this range. Try a longer range.</p>'; return; }
  const W=Math.max(260,Math.round(el.clientWidth)), H=200, L=42, R=10, T=12, B=26;
  let x0=pts[0].t, x1=pts[pts.length-1].t; if(x1-x0<DAY){ x0-=3*DAY; x1+=3*DAY; }
  const vs=pts.map(p=>p.v), tk=niceTicks(Math.min(...vs),Math.max(...vs),4), y0=tk[0], y1=tk[tk.length-1];
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g='';
  for(const v of tk){ const y=Y(v).toFixed(1); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--hair)" stroke-width="1"/><text class="ax" x="${L-8}" y="${y}" text-anchor="end" dominant-baseline="middle">${esc(C.ax(v))}</text>`; }
  const xl=[[pts[0].t,'start']]; if(pts.length>1) xl.push([pts[pts.length-1].t,'end']);
  if(pts.length>4&&W>330) xl.splice(1,0,[pts[Math.floor(pts.length/2)].t,'middle']);
  for(const [t,a] of xl){ const x=Math.min(W-R,Math.max(L,X(t))); g+=`<text class="ax" x="${x.toFixed(1)}" y="${H-6}" text-anchor="${pts.length===1?'middle':a}">${esc(fmtShort(t))}</text>`; }
  const P=pts.map(p=>[X(p.t),Y(p.v)]);
  const line=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=P.length>1?`<path d="${line} L${P[P.length-1][0].toFixed(1)} ${H-B} L${P[0][0].toFixed(1)} ${H-B} Z" fill="var(--acc)" opacity=".16"/>`:'';
  const dots=P.length<=40?P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===P.length-1?5:3.5}" fill="var(--acc-ink)" stroke="var(--surface)" stroke-width="2"/>`).join(''):`<circle cx="${P[P.length-1][0].toFixed(1)}" cy="${P[P.length-1][1].toFixed(1)}" r="5" fill="var(--acc-ink)" stroke="var(--surface)" stroke-width="2"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Line chart, ${pts.length} sessions">${g}${area}<path d="${line}" fill="none" stroke="var(--acc-ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<line id="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><circle id="xf" r="6" fill="var(--fg)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>${pts.length===1?'<p class="note small">One session so far. Log another to see the trend.</p>':''}`;
  const svg=el.querySelector('svg'), tip=el.querySelector('#tip'), xh=el.querySelector('#xh'), xf=el.querySelector('#xf');
  const show=ev=>{
    const r=svg.getBoundingClientRect(); const mx=(ev.clientX-r.left)*(W/r.width);
    let bi=0,bd=1e9; P.forEach((p,i)=>{const d=Math.abs(p[0]-mx); if(d<bd){bd=d;bi=i;}});
    const p=P[bi], pt=pts[bi];
    xh.setAttribute('x1',p[0]); xh.setAttribute('x2',p[0]); xh.setAttribute('visibility','visible');
    xf.setAttribute('cx',p[0]); xf.setAttribute('cy',p[1]); xf.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`${esc(fmtDate(pt.t))}<b>${esc(C.fmt(pt.v))}</b>${esc(pt.sub.length>44?pt.sub.slice(0,42)+'…':pt.sub)}`;
    const px=p[0]*(r.width/W), half=tip.offsetWidth/2;
    tip.style.left=Math.min(r.width-half,Math.max(half,px))+'px';
    tip.style.top=Math.max(-8,(p[1]*(r.height/H))-tip.offsetHeight-12)+'px';
  };
  const hide=()=>{ tip.hidden=true; xh.setAttribute('visibility','hidden'); xf.setAttribute('visibility','hidden'); };
  svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',hide);
}

    case 'theme': S.theme=v; save(); applyTheme(); render(true); break;
    case 'accent': S.accent=v; save(); applyTheme(); render(true); break;
    case 'importxl': { const n=importHistory(); toast(`Imported ${n} sets from your spreadsheet`); render(true); break; }
    case 'unsample': S.sets=S.sets.filter(s=>!s.sample); save(); toast('Sample history removed'); render(true); break;
    case 'unit': S.unit=v; save(); render(true); break;
    case 'newex': openExForm(null,v); break;
    case 'editex': openExForm(id); break;
    case 'fpart': readForm(); F.part=v; renderExForm(); break;
    case 'faddpart': readForm(); F.addPart=true; renderExForm(); break;
    case 'fsavepart': { readForm(); const r=addPart(document.getElementById('fNewPart').value); if(r.err){ F.err=r.err; } else { F.part=r.name; F.addPart=false; F.err=''; } renderExForm(); break; }
    case 'ftype': readForm(); F.type=v; renderExForm(); break;
    case 'fdel': readForm(); F.del=true; renderExForm(); break;
    case 'fdelno': readForm(); F.del=false; renderExForm(); break;
    case 'fdelyes': { const gone=F.id; S.exercises=S.exercises.filter(e=>e.id!==gone); S.sets=S.sets.filter(s=>s.ex!==gone); save(); closeSheet(); toast('Exercise deleted'); render(true); break; }
    case 'fsave': {
      readForm(); const name=F.name.trim().replace(/\s+/g,' ');
      if(!name){ F.err='Give the exercise a name.'; renderExForm(); break; }
      const dup=S.exercises.find(e=>e.id!==F.id&&e.part===F.part&&e.name.toLowerCase()===name.toLowerCase());
      if(dup){ F.err=`${F.part} already has ${dup.name}.`; renderExForm(); break; }
      if(F.id){ const e=exById(F.id); e.name=name; e.part=F.part; e.type=F.type; }
      else S.exercises.push({id:uid(),name,part:F.part,type:F.type});
      save(); const wasNew=!F.id; closeSheet(); toast(wasNew?`Added ${name}`:'Saved'); render(true); break;
    }
    case 'newpart': openPartForm(null); break;
    case 'editpart': openPartForm(v); break;
    case 'psave': {
      const old=v, val=document.getElementById('pName').value.trim().replace(/\s+/g,' '), err=document.getElementById('pErr');
      if(!val){ err.textContent='Type a name.'; err.hidden=false; break; }
      if(S.parts.some(p=>p!==old&&p.toLowerCase()===val.toLowerCase())){ err.textContent=`${val} already exists.`; err.hidden=false; break; }
      if(old){ const i=S.parts.indexOf(old); S.parts[i]=val; S.exercises.forEach(e=>{ if(e.part===old) e.part=val; }); if(view.part===old) view.part=val; save(); }
      else addPart(val);
      closeSheet(); render(true); break;
    }
    case 'pdel': S.parts=S.parts.filter(p=>p!==v); save(); closeSheet(); render(true); break;
    case 'pup': { const i=S.parts.indexOf(v); if(i>0){ [S.parts[i-1],S.parts[i]]=[S.parts[i],S.parts[i-1]]; save(); } closeSheet(); render(true); break; }
    case 'dljson': if(download(`twotap-backup-${stamp()}.json`,backupText(),'application/json')){ S.lastBackup=Date.now(); save(); render(true); } break;
    case 'dlcsv': download(`twotap-log-${stamp()}.csv`,csvText(),'text/csv'); break;
    case 'copyjson': S.lastBackup=Date.now(); save(); copyText(backupText(),'Backup'); render(true); break;
    case 'restore': document.getElementById('restoreFile').click(); break;
    case 'pasterestore': sheet(`<h2>Restore from text</h2><p class="meta">Paste a backup you copied earlier.</p><textarea class="inp" id="rsText" style="margin-top:12px" placeholder='{"app":"TwoTap", …}'></textarea><p class="err" id="rsErr" hidden></p><div class="actions"><button class="btn pri block" data-act="rscheck">Continue</button><button class="btn block" data-act="close">Cancel</button></div>`); break;
    case 'rscheck': { const d=parseBackup(document.getElementById('rsText').value); if(!d){ const e=document.getElementById('rsErr'); e.textContent="That text isn't a TwoTap backup. Paste the whole thing, from the first { to the last }."; e.hidden=false; break; } confirmRestore(d); break; }
    case 'dorestore': if(pendingRestore){ S=pendingRestore; pendingRestore=null; save(); applyTheme(); closeSheet(); toast(`Restored ${S.sets.length} sets`); go({name:'home'}); } break;
    case 'erase': sheet(`<h2>Erase everything?</h2><p class="meta">All ${S.sets.length} logged sets will be deleted from this phone and your exercise list goes back to the spreadsheet's list. Save a backup first if you might want them.</p><div class="actions"><button class="btn dangerfill block" data-act="doerase">Erase all data</button><button class="btn block" data-act="close">Cancel</button></div>`); break;
    case 'doerase': { const th=S.theme, ac=S.accent; S=defaults(); S.theme=th; S.accent=ac; save(); closeSheet(); toast('Erased. Your exercise list is back, with no sets.'); go({name:'home'}); break; }
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!document.getElementById('sheet').hidden) closeSheet();
  if(ev.key==='Enter'&&ev.target.id==='fNewPart'){ ev.preventDefault(); document.querySelector('[data-act="fsavepart"]').click(); }
  else if(ev.key==='Enter'&&ev.target.id==='fName'){ ev.preventDefault(); ev.target.blur(); }
  else if(ev.key==='Enter'&&ev.target.id==='pName'){ ev.preventDefault(); document.querySelector('[data-act="psave"]').click(); }
});
document.getElementById('restoreFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const d=parseBackup(r.result); if(!d){ toast("That file isn't a TwoTap backup."); return; } confirmRestore(d); }; r.readAsText(f);
});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>document.querySelectorAll('[data-chart]').forEach(drawChart),150); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&view.name!=='log') render(true); });

/* ---------- boot ---------- */
load(); save(); applyTheme();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
renderTabs(); render(false);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
